[package]
name = "rpi-anysearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "AnySearch tools for rpi: web search, vertical domain search, batch search and URL extraction."
readme = "README.md"
repository = "https://github.com/morler/rpi-anysearch"
keywords = ["rpi", "anysearch", "search", "extension", "agent"]
categories = ["development-tools"]
include = ["src/**/*.rs", "assets/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
# cdylib for the host loader; rlib so `cargo test` can link the modules.
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "0.8"
serde_json = "1"
# rustls (ring provider + webpki roots): the plugin must not depend on a system
# OpenSSL that may be absent on the host machine.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
# Keep symbol names: the artifact is loaded into the host process, and a panic
# inside the plugin is otherwise impossible to read.
strip = "debuginfo"
